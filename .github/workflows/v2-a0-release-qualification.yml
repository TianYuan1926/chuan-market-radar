name: V2 A0 Release Qualification

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-a0-release-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-provenance-and-rollback:
    name: Reproducible rootfs, provenance and rollback
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BUILDX_IMAGE: docker/buildx-bin:0.31.1@sha256:49141c168b609ef38f2b11bc231d48e2492ec1f979c2b9aa4ab691790cce115d
      COLLECTOR_IMAGE: market-radar-v2-m1-collector:a0-${{ github.sha }}
    steps:
      - name: Checkout exact source and full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup exact Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm

      - name: Bind isolated qualification workspace
        shell: bash
        run: |
          printf '%s\n' \
            "EVIDENCE_ROOT=$RUNNER_TEMP/v2-a0-release" \
            >> "$GITHUB_ENV"

      - name: Verify exact clean source and runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test "$(node --version)" = "v22.23.1"
          test "$(npm --version)" = "10.9.8"

      - name: Install exact build dependencies
        run: npm ci

      - name: Build minimal collector application closure
        run: npm run build:v2-m1-collector-image

      - name: Build deterministic application capsule and drill rollback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_ROOT"
          node scripts/v2/production/a0-release-qualification.mjs \
            "--source-commit=$GITHUB_SHA" \
            "--output=$EVIDENCE_ROOT/local"

      - name: Verify exact pinned Buildx
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$BUILDX_IMAGE"
          version="$(docker run --rm \
            --entrypoint /buildx \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume /etc/ssl/certs:/etc/ssl/certs:ro \
            "$BUILDX_IMAGE" version)"
          case "$version" in
            *"v0.31.1"*) ;;
            *) echo "unexpected Buildx version: $version" >&2; exit 1 ;;
          esac

      - name: Independently build canonical rootfs A
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint /buildx \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume /etc/ssl/certs:/etc/ssl/certs:ro \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$EVIDENCE_ROOT:/evidence" \
            --workdir /workspace \
            "$BUILDX_IMAGE" build \
            --pull \
            --no-cache \
            --progress=plain \
            --build-arg "SOURCE_DATE_EPOCH=946684800" \
            --build-arg "V2_M1_COLLECTOR_SOURCE_COMMIT=$GITHUB_SHA" \
            --file deploy/v2/m1-collector/Dockerfile \
            --output "type=local,dest=/evidence/rootfs-a" \
            .

      - name: Independently build canonical rootfs B
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint /buildx \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume /etc/ssl/certs:/etc/ssl/certs:ro \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$EVIDENCE_ROOT:/evidence" \
            --workdir /workspace \
            "$BUILDX_IMAGE" build \
            --pull \
            --no-cache \
            --progress=plain \
            --build-arg "SOURCE_DATE_EPOCH=946684800" \
            --build-arg "V2_M1_COLLECTOR_SOURCE_COMMIT=$GITHUB_SHA" \
            --file deploy/v2/m1-collector/Dockerfile \
            --output "type=local,dest=/evidence/rootfs-b" \
            .

      - name: Load exact collector image for configuration and runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint /buildx \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume /etc/ssl/certs:/etc/ssl/certs:ro \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            "$BUILDX_IMAGE" build \
            --pull \
            --progress=plain \
            --build-arg "SOURCE_DATE_EPOCH=946684800" \
            --build-arg "V2_M1_COLLECTOR_SOURCE_COMMIT=$GITHUB_SHA" \
            --file deploy/v2/m1-collector/Dockerfile \
            --tag "$COLLECTOR_IMAGE" \
            --load \
            .
          docker image inspect "$COLLECTOR_IMAGE" \
            > "$EVIDENCE_ROOT/image-inspect.json"

      - name: Run no-network read-only fail-closed runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --network none \
            --read-only \
            --entrypoint /nodejs/bin/node \
            "$COLLECTOR_IMAGE" \
            --version > "$EVIDENCE_ROOT/node-version.txt"
          set +e
          docker run --rm \
            --network none \
            --read-only \
            --env "V2_M1_COLLECTOR_AUTHORITY_MODE=A0_INVALID_PROBE" \
            --env "V2_M1_COLLECTOR_AUTOMATIC_TRADING_ALLOWED=false" \
            "$COLLECTOR_IMAGE" \
            > "$EVIDENCE_ROOT/entrypoint-stdout.txt" \
            2> "$EVIDENCE_ROOT/entrypoint-stderr.txt"
          entrypoint_status="$?"
          set -e
          test ! -s "$EVIDENCE_ROOT/entrypoint-stdout.txt"
          node scripts/v2/production/a0-runtime-smoke-evidence.mjs \
            "--source-commit=$GITHUB_SHA" \
            "--node-version=$EVIDENCE_ROOT/node-version.txt" \
            "--entrypoint-stderr=$EVIDENCE_ROOT/entrypoint-stderr.txt" \
            "--entrypoint-exit-code=$entrypoint_status" \
            "--output=$EVIDENCE_ROOT/runtime-smoke.json"

      - name: Bind reproducible rootfs, image config and rollback provenance
        shell: bash
        run: |
          set -euo pipefail
          node scripts/v2/production/a0-rootfs-provenance-evidence.mjs \
            "--source-commit=$GITHUB_SHA" \
            "--rootfs-a=$EVIDENCE_ROOT/rootfs-a" \
            "--rootfs-b=$EVIDENCE_ROOT/rootfs-b" \
            "--image-inspect=$EVIDENCE_ROOT/image-inspect.json" \
            "--runtime-smoke=$EVIDENCE_ROOT/runtime-smoke.json" \
            "--local-evidence=$EVIDENCE_ROOT/local/a0-release-local-evidence.json" \
            "--application-capsule=$EVIDENCE_ROOT/local/application-release-a.tar" \
            "--output=$EVIDENCE_ROOT/rootfs-provenance.json"

      - name: Upload sanitized provenance and rollback evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v2-a0-release-provenance-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/v2-a0-release/local/a0-release-local-evidence.json
            ${{ runner.temp }}/v2-a0-release/local/application-release-a.tar
            ${{ runner.temp }}/v2-a0-release/runtime-smoke.json
            ${{ runner.temp }}/v2-a0-release/rootfs-provenance.json
          if-no-files-found: error
          retention-days: 30

      - name: Destroy qualification workspace
        if: always()
        shell: bash
        run: |
          test -n "$EVIDENCE_ROOT"
          case "$EVIDENCE_ROOT" in
            "$RUNNER_TEMP"/*) ;;
            *) echo "refusing to clean outside RUNNER_TEMP" >&2; exit 1 ;;
          esac
          sudo rm -rf -- "$EVIDENCE_ROOT"
          docker image rm --force "$COLLECTOR_IMAGE" >/dev/null 2>&1 || true

      - name: Prove qualification has no production authority
        if: always()
        run: |
          echo "production_execution=false"
          echo "production_mutation=false"
          echo "production_credentials=false"
          echo "automatic_trading=false"

  performance-and-resource-baseline:
    name: Frozen 1440-instrument engineering baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source and full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup exact Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm

      - name: Bind isolated performance workspace
        shell: bash
        run: |
          printf '%s\n' \
            "EVIDENCE_ROOT=$RUNNER_TEMP/v2-a0-performance" \
            >> "$GITHUB_ENV"

      - name: Verify exact clean source and runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test "$(node --version)" = "v22.23.1"
          test "$(npm --version)" = "10.9.8"

      - name: Install exact lockfile
        run: npm ci

      - name: Build collector engineering runtime
        run: npm run build:market-cli

      - name: Run frozen engineering performance and resource baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_ROOT"
          node --expose-gc \
            scripts/v2/production/a0-performance-resource-baseline.mjs \
            "--source-commit=$GITHUB_SHA" \
            "--output=$EVIDENCE_ROOT/performance-resource.json"

      - name: Upload sanitized performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v2-a0-performance-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v2-a0-performance/performance-resource.json
          if-no-files-found: error
          retention-days: 30

      - name: Prove performance runner has no production authority
        if: always()
        run: |
          echo "evidence_class=TEST_ONLY_ENGINEERING_RESOURCE_BASELINE_NOT_LIVE_MARKET_CAPACITY"
          echo "production_execution=false"
          echo "production_mutation=false"
          echo "production_credentials=false"
          echo "automatic_trading=false"
